version: "3.8"

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "60001:60001"
    environment:
      - USER_SERVICE_ENV=dev
      - USER_SERVICE_HOST=0.0.0.0
      - USER_SERVICE_DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
